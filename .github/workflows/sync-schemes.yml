name: Automated Welfare Scheme Sync
on:
  schedule:
    # Run every Sunday at 00:00 UTC (05:30 IST)
    - cron: '0 0 * * 0'
  workflow_dispatch: # Allows manual 1-click execution from GitHub Actions UI

jobs:
  sync-schemes:
    name: Harvest & Sync Schemes to Firestore
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Execute 10-Stage GovTech Pipeline
        env:
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_CLIENT_EMAIL: ${{ secrets.FIREBASE_CLIENT_EMAIL }}
          FIREBASE_PRIVATE_KEY: ${{ secrets.FIREBASE_PRIVATE_KEY }}
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
        run: npm run push:schemes
